# fly.toml app configuration file generated for gbp-receptionist on 2026-04-15T16:32:44+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gbp-receptionist'
primary_region = 'cdg'

[build]

[env]
  PORT = '8080'

[[mounts]]
  source = 'gbp_data'
  destination = '/app/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
